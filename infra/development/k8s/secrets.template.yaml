apiVersion: v1
kind: Secret
metadata:
  name: external-apis
type: Opaque
stringData:
  # In-cluster self-hosted OSRM (see osrm-deployment.yaml); no domain/TLS needed for dev
  osrm: "http://osrm:5000"
---
apiVersion: v1
kind: Secret
metadata:
  name: stripe-secrets
type: Opaque
stringData:
   stripe-secret-key: "<STRIPE_SECRET_KEY>"
   stripe-webhook-key: "<STRIPE_WEBHOOK_KEY>"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb
type: Opaque
stringData:
  uri: "mongodb://mongodb:27017"