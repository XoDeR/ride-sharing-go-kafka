apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: osrm-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: osrm
  template:
    metadata:
      labels:
        app: osrm
    spec:
      # Netherlands / North-Holland extract (covers Amsterdam) is downloaded and
      # preprocessed once into the PVC below; later pod restarts skip straight to serving.
      initContainers:
        - name: download-map
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              set -e
              cd /data
              if [ ! -f noord-holland-latest.osm.pbf ]; then
                echo "Downloading Noord-Holland (Amsterdam) OSM extract..."
                curl -fL -o noord-holland-latest.osm.pbf \
                  https://download.geofabrik.de/europe/netherlands/noord-holland-latest.osm.pbf
              else
                echo "Map extract already present, skipping download."
              fi
          volumeMounts:
            - name: osrm-data
              mountPath: /data
        - name: preprocess-map
          image: osrm/osrm-backend:latest
          command:
            - sh
            - -c
            - |
              set -e
              cd /data
              if [ ! -f .preprocessed ]; then
                echo "Preprocessing map for OSRM (this can take a few minutes)..."
                osrm-extract -p /opt/car.lua noord-holland-latest.osm.pbf
                osrm-partition noord-holland-latest.osrm
                osrm-customize noord-holland-latest.osrm
                touch .preprocessed
              else
                echo "Map already preprocessed, skipping."
              fi
          volumeMounts:
            - name: osrm-data
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1500Mi"
              cpu: "1500m"
      containers:
        - name: osrm-routed
          image: osrm/osrm-backend:latest
          command:
            - osrm-routed
            - --algorithm
            - mld
            - --port
            - "5000"
            - /data/noord-holland-latest.osrm
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /route/v1/driving/4.9041,52.3676;4.9,52.37
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: osrm-data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: osrm-data
          persistentVolumeClaim:
            claimName: osrm-data
---
apiVersion: v1
kind: Service
metadata:
  name: osrm
spec:
  selector:
    app: osrm
  ports:
    - port: 5000
      name: http
      targetPort: 5000
  type: ClusterIP
